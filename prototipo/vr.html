<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Digitrilha VR — Campus Virtual 3D (14 Unidades)</title>
  <meta name="description" content="Simulação em Realidade Virtual 3D e Apoio à Decisão Clínica em Tecnologia Assistiva para o SUS em 5 Salas Temáticas.">
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0b0f19; overflow: hidden; }

    /* HUD (Navegação Superior) */
    #vr-ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
    }

    #vr-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(180deg, rgba(11,15,25,0.98) 0%, rgba(11,15,25,0.85) 100%);
      border-bottom: 1px solid rgba(0,165,153,0.3);
      pointer-events: auto;
    }

    .vr-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
    }

    .vr-logo-icon {
      background: linear-gradient(135deg, #00a599, #004f9f);
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(0,165,153,0.4);
    }

    /* BARRA DE SALAS PARA NAVEGAÇÃO RÁPIDA */
    .room-nav-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .room-nav-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .room-nav-btn:hover, .room-nav-btn.active {
      background: #00a599;
      color: white;
      border-color: #00ffd8;
      box-shadow: 0 2px 10px rgba(0,165,153,0.5);
    }

    #vr-instructions {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(0, 165, 153, 0.5);
      border-radius: 50px;
      padding: 10px 24px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 500;
      pointer-events: none;
      backdrop-filter: blur(12px);
      white-space: nowrap;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      animation: floatInstr 3s ease-in-out infinite;
    }

    @keyframes floatInstr {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }

    #vr-back-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: white;
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    #vr-back-btn:hover { background: rgba(0,165,153,0.4); border-color: #00a599; }

    /* PAINEL MODAL INTERATIVO 2D OVERLAY */
    #info-panel {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #00a599;
      border-radius: 20px;
      padding: 26px;
      width: 90%;
      max-width: 540px;
      z-index: 1000;
      pointer-events: auto;
      display: none;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 35px rgba(0,165,153,0.4);
      color: white;
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    #info-panel h3 {
      font-family: 'Outfit', sans-serif;
      color: #00ffd8;
      font-size: 1.2rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #info-panel p {
      color: #cbd5e1;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .modal-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-opt-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .modal-opt-btn:hover {
      background: #004f9f;
      border-color: #00a599;
      transform: translateX(4px);
    }

    .feedback-box-vr {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
    }

    .feedback-correct-vr { background: rgba(5, 150, 105, 0.25); border: 1px solid #059669; color: #6ee7b7; }
    .feedback-incorrect-vr { background: rgba(220, 38, 38, 0.25); border: 1px solid #dc2626; color: #fca5a5; }

    #info-panel .close-info {
      position: absolute;
      top: 16px; right: 18px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #info-panel .close-info:hover { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <!-- HEADER NAVEGADOR -->
  <div id="vr-ui">
    <div id="vr-header">
      <a href="index.html" class="vr-logo">
        <div class="vr-logo-icon">✚</div>
        Digitrilha <strong style="color:#00a599">VR 3D</strong>
      </a>

      <!-- MENU DE SALAS -->
      <div class="room-nav-bar">
        <button class="room-nav-btn active" onclick="teleportToRoom(1)">🏛️ Sala 1: Fundamentos</button>
        <button class="room-nav-btn" onclick="teleportToRoom(2)">🩺 Sala 2: Avaliação</button>
        <button class="room-nav-btn" onclick="teleportToRoom(3)">🦾 Sala 3: Laboratório OPM</button>
        <button class="room-nav-btn" onclick="teleportToRoom(4)">⚙️ Sala 4: Manufatura 3D</button>
        <button class="room-nav-btn" onclick="teleportToRoom(5)">🏆 Sala 5: Resultados</button>
      </div>

      <a href="index.html" id="vr-back-btn">← Sair</a>
    </div>
  </div>

  <!-- INSTRUÇÕES -->
  <div id="vr-instructions">
    🖱️ Clique com o mouse nos marcadores azuis pulsantes para interagir | Use os botões no topo para alternar de Sala
  </div>

  <!-- PAINEL MODAL DE RESPOSTA -->
  <div id="info-panel">
    <button class="close-info" onclick="closeVRModal()">✕</button>
    <h3 id="info-title"><span>📍</span> ESTAÇÃO DE APRENDIZADO VR</h3>
    <p id="info-text"></p>
    <div class="modal-options" id="modal-options"></div>
    <div class="feedback-box-vr" id="feedback-vr"></div>
  </div>

  <!-- CENA A-FRAME WEBXR -->
  <a-scene
    background="color: #0b0f19"
    fog="type: linear; color: #0b0f19; near: 20; far: 45"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
    loading-screen="dotsColor: #00a599; backgroundColor: #0b0f19"
  >

    <!-- === CÂMERA E CONTROLES === -->
    <a-entity id="rig" position="0 0 5">
      <a-camera id="main-camera" look-controls="reverseMouseDrag: false" wasd-controls="enabled: true" position="0 1.6 0">
        <a-cursor
          id="vr-cursor"
          color="#00ffd8"
          fuse="false"
          raycaster="objects: .clickable"
          cursor="rayOrigin: mouse"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <!-- === ASSETS & MIXINS === -->
    <a-assets>
      <a-mixin id="hotspot"
        geometry="primitive: sphere; radius: 0.22"
        material="color: #00a599; emissive: #00ffd8; emissiveIntensity: 0.8; transparent: true; opacity: 0.9"
        animation="property: scale; dir: alternate; dur: 1000; loop: true; to: 1.3 1.3 1.3; easing: easeInOutSine"
        class="clickable">
      </a-mixin>

      <a-mixin id="pedestal"
        geometry="primitive: cylinder; radius: 0.45; height: 0.8"
        material="color: #1e293b; roughness: 0.4">
      </a-mixin>

      <a-mixin id="room-floor"
        geometry="primitive: plane; width: 12; height: 12"
        rotation="-90 0 0"
        material="color: #111827; roughness: 0.8">
      </a-mixin>
    </a-assets>

    <!-- ============================================================ -->
    <!-- SALA 1 (EIXO 1 — UNIDADES 1 & 2: FUNDAMENTOS & LBI)           -->
    <!-- Posição: Center X: 0, Z: 0                                   -->
    <!-- ============================================================ -->
    <a-entity id="sala-1" position="0 0 0">
      <!-- CHÃO E TETO -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" material="color: #1e293b; roughness: 0.8"></a-plane>
      <a-plane position="0 3.6 0" rotation="90 0 0" width="12" height="12" material="color: #0f172a; roughness: 0.9"></a-plane>
      
      <!-- PAREDES DA SALA 1 -->
      <a-plane position="0 1.8 -6" width="12" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="-6 1.8 0" rotation="0 90 0" width="12" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="6 1.8 0" rotation="0 -90 0" width="12" height="3.6" material="color: #0f172a"></a-plane>

      <!-- PAINEL DE TÍTULO DA SALA 1 -->
      <a-plane position="0 2.8 -5.9" width="7" height="0.9" material="color: #004f9f; opacity: 0.9">
        <a-text value="🏛️ SALA 1 — UNIDADES 1 & 2: FUNDAMENTOS DE TA & LBI" align="center" position="0 0 0.02" color="#ffffff" width="4.5" wrap-count="28"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 1.1: O que é Tecnologia Assistiva & LBI -->
      <a-cylinder mixin="pedestal" position="-3 0.4 -3"></a-cylinder>
      <a-box position="-3 1.0 -3" width="0.4" height="0.4" depth="0.4" material="color: #00a599"></a-box>
      <a-sphere mixin="hotspot" position="-3 1.5 -3"
        data-info="🏛️ UNIDADE 1 — CONCEITO DE TA & LEI 13.146/2015"
        data-text="A Tecnologia Assistiva no SUS engloba produtos, recursos e metodologias para independência funcional. Qual a garantia dada pela Lei Brasileira de Inclusão (LBI)?"
        data-options='[
          {"text": "Acesso gratuito e universal a recursos de TA na Rede de Cuidados no SUS", "correct": true, "feedback": "Excelente! A LBI estabelece o direito universal à Tecnologia Assistiva."},
          {"text": "Apenas empréstimo temporário mediante cobrança de taxa", "correct": false, "feedback": "Incorreto. A provisão no SUS é pública e gratuita."}
        ]'
      ></a-sphere>
      <a-plane position="-3 2.1 -3" width="2.4" height="0.6" material="color: #0f172a; opacity: 0.95; stroke: #00a599; strokeWidth: 2">
        <a-text value="Unidade 1: Conceito de TA & LBI
(Clique na esfera)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="22"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 1.2: Classificação CIF (OMS) -->
      <a-cylinder mixin="pedestal" position="3 0.4 -3"></a-cylinder>
      <a-box position="3 1.0 -3" width="0.4" height="0.4" depth="0.4" material="color: #004f9f"></a-box>
      <a-sphere mixin="hotspot" position="3 1.5 -3"
        data-info="📊 UNIDADE 2 — AVALIAÇÃO PELA CIF (OMS)"
        data-text="Na Classificação Internacional de Funcionalidade (CIF), como se diferencia a alteração anatômica (Estrutura) do impacto diário (Participação)?"
        data-options='[
          {"text": "Estrutura refere-se à anatomia e Participação refere-se ao engajamento social nas AVDs", "correct": true, "feedback": "Perfeito! A CIF avalia a pessoa de forma holística em seu ambiente."},
          {"text": "Estrutura e Participação são termos sinônimos", "correct": false, "feedback": "Incorreto. Estrutura é anatômica, Participação é social."}
        ]'
      ></a-sphere>
      <a-plane position="3 2.1 -3" width="2.4" height="0.6" material="color: #0f172a; opacity: 0.95; stroke: #00a599; strokeWidth: 2">
        <a-text value="Unidade 2: Avaliação CIF
(Clique na esfera)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="22"></a-text>
      </a-plane>

      <!-- TUTORA E.V.A. ROBÔ DA SALA 1 -->
      <a-entity position="0 0 -3" class="clickable" onclick="clickEVA()">
        <a-cylinder radius="0.2" height="0.06" position="0 0.03 0" material="color: #004f9f"></a-cylinder>
        <a-cylinder radius="0.12" height="0.6" position="0 0.33 0" material="color: #00a599"></a-cylinder>
        <a-box width="0.4" height="0.5" depth="0.25" position="0 0.88 0" material="color: #004f9f"></a-box>
        <a-sphere radius="0.2" position="0 1.3 0" material="color: #00a599; emissive: #00a599; emissiveIntensity: 0.4"></a-sphere>
        <a-box width="0.14" height="0.06" depth="0.02" position="-0.06 1.33 0.19" material="color: #00ffd8; emissive: #00ffd8; emissiveIntensity: 1.0"></a-box>
        <a-box width="0.14" height="0.06" depth="0.02" position="0.06 1.33 0.19" material="color: #00ffd8; emissive: #00ffd8; emissiveIntensity: 1.0"></a-box>
      </a-entity>
      <a-plane position="0 2.0 -3" width="2.6" height="0.5" material="color: #0f172a; opacity: 0.95">
        <a-text value="🤖 E.V.A. — Tutora Digital
(Clique para Orientação)" align="center" position="0 0 0.02" color="#00ffd8" width="2.4" wrap-count="22"></a-text>
      </a-plane>
    </a-entity>

    <!-- ============================================================ -->
    <!-- SALA 2 (EIXO 2 — UNIDADES 3, 4 & 5: AVALIAÇÃO CLÍNICA)         -->
    <!-- Posição: Center X: -16, Z: 0                                 -->
    <!-- ============================================================ -->
    <a-entity id="sala-2" position="-16 0 0">
      <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" material="color: #1e293b; roughness: 0.8"></a-plane>
      <a-plane position="0 3.6 0" rotation="90 0 0" width="12" height="12" material="color: #0f172a"></a-plane>
      
      <a-plane position="0 1.8 -6" width="12" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="-6 1.8 0" rotation="0 90 0" width="12" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="6 1.8 0" rotation="0 -90 0" width="12" height="3.6" material="color: #0f172a"></a-plane>

      <a-plane position="0 2.8 -5.9" width="7.5" height="0.9" material="color: #004f9f; opacity: 0.9">
        <a-text value="🩺 SALA 2 — UNIDADES 3, 4 & 5: AVALIAÇÃO CLÍNICA & TRIAGEM" align="center" position="0 0 0.02" color="#ffffff" width="4.5" wrap-count="30"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 2.1: Caso Dona Maria (AFO no Pé Caído) -->
      <a-cylinder mixin="pedestal" position="-3 0.4 -3"></a-cylinder>
      <a-sphere mixin="hotspot" position="-3 1.5 -3"
        data-info="🦶 UNIDADE 3 — CASO DONA MARIA (PÓS-AVC & PÉ CAÍDO)"
        data-text="Dona Maria (72 anos, pós-AVC) apresenta fraqueza nos dorsiflexores e pé caído à esquerda durante o treino de marcha. Qual a conduta ortótica mais adequada?"
        data-options='[
          {"text": "Prescrever Órtese Tornozelo-Pé (AFO) alinhada a 90° e orientação de calçado fechado", "correct": true, "feedback": "Excelente! A AFO mantém o tornozelo funcional a 90°, evita o arrasto do pé e previne quedas."},
          {"text": "Manter marcha sem apoio ortótico", "correct": false, "feedback": "Incorreto. A falta de apoio mantém o risco de queda."}
        ]'
      ></a-sphere>
      <a-plane position="-3 2.1 -3" width="2.5" height="0.6" material="color: #0f172a; opacity: 0.95; stroke: #00a599; strokeWidth: 2">
        <a-text value="Unidade 3: Caso Dona Maria
(Clique na esfera)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="22"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 2.2: Elementos Obrigatórios no Laudo -->
      <a-cylinder mixin="pedestal" position="3 0.4 -3"></a-cylinder>
      <a-sphere mixin="hotspot" position="3 1.5 -3"
        data-info="📋 UNIDADE 4 — ELEMENTOS DO LAUDO DE SOLICITAÇÃO"
        data-text="Qual elemento NÃO pode faltar no laudo de solicitação de OPM emitido na Atenção Primária?"
        data-options='[
          {"text": "Descrição clara da limitação funcional e do objetivo terapêutico pretendido", "correct": true, "feedback": "Gabarito Oficial! O objetivo funcional é indispensável para aprovação da OPM."},
          {"text": "Apenas o nome comercial da marca do fabricante", "correct": false, "feedback": "Incorreto. No SUS prescreve-se por código da Tabela SIGTAP."}
        ]'
      ></a-sphere>
      <a-plane position="3 2.1 -3" width="2.5" height="0.6" material="color: #0f172a; opacity: 0.95; stroke: #00a599; strokeWidth: 2">
        <a-text value="Unidade 4: Laudo de OPM
(Clique na esfera)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="22"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 2.3: Os 5 Erros Frequentes na Prescrição -->
      <a-cylinder mixin="pedestal" position="0 0.4 -4"></a-cylinder>
      <a-sphere mixin="hotspot" position="0 1.5 -4"
        data-info="⚠️ UNIDADE 5 — OS 5 ERROS FREQUENTES DE PRESCRIÇÃO"
        data-text="Estudos no SUS apontam que a desconsideração do ambiente domiciliar e a falta de reavaliação causam alto abandono de OPM. Qual a melhor prática de prevenção?"
        data-options='[
          {"text": "Avaliar acessibilidade do domicílio e realizar seguimento longitudinal periódico", "correct": true, "feedback": "Perfeito! O acompanhamento continuo garante a adesão ao tratamento."},
          {"text": "Entregar a OPM e encerrar o acompanhamento do paciente", "correct": false, "feedback": "Incorreto. Sem reavaliação o risco de abandono ultrapassa 40%."}
        ]'
      ></a-sphere>
      <a-plane position="0 2.1 -4" width="2.5" height="0.6" material="color: #0f172a; opacity: 0.95; stroke: #00a599; strokeWidth: 2">
        <a-text value="Unidade 5: Prevenção de Erros
(Clique na esfera)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="22"></a-text>
      </a-plane>
    </a-entity>

    <!-- ============================================================ -->
    <!-- SALA 3 (EIXO 3 — UNIDADES 6, 7 & 8: LABORATÓRIO DE OPM)        -->
    <!-- Posição: Center X: 16, Z: 0                                  -->
    <!-- ============================================================ -->
    <a-entity id="sala-3" position="16 0 0">
      <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" material="color: #1e293b; roughness: 0.8"></a-plane>
      <a-plane position="0 3.6 0" rotation="90 0 0" width="12" height="12" material="color: #0f172a"></a-plane>
      
      <a-plane position="0 1.8 -6" width="12" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="-6 1.8 0" rotation="0 90 0" width="12" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="6 1.8 0" rotation="0 -90 0" width="12" height="3.6" material="color: #0f172a"></a-plane>

      <a-plane position="0 2.8 -5.9" width="7.5" height="0.9" material="color: #004f9f; opacity: 0.9">
        <a-text value="🦾 SALA 3 — UNIDADES 6, 7 & 8: LABORATÓRIO DE ÓRTESES & PRÓTESES" align="center" position="0 0 0.02" color="#ffffff" width="4.5" wrap-count="32"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 3.1: Sistema de 3 Pontos de Pressão (Unidade 6) -->
      <a-cylinder mixin="pedestal" position="-3 0.4 -3"></a-cylinder>
      <a-sphere mixin="hotspot" position="-3 1.5 -3"
        data-info="🧲 UNIDADE 6 — BIOMECÂNICA DOS 3 PONTOS DE PRESSÃO"
        data-text="Como funciona a correção biomecânica pelo sistema de 3 pontos de pressão em órteses?"
        data-options='[
          {"text": "Aplica-se uma força principal no ápice da deformidade e duas forças opostas nas extremidades", "correct": true, "feedback": "Exato! Este princípio garante controle e alinhamento articular."},
          {"text": "Compressão circular uniforme ao redor de toda a perna", "correct": false, "feedback": "Incorreto. A compressão uniforme restringe o fluxo sanguíneo sem corrigir a deformidade."}
        ]'
      ></a-sphere>
      <a-plane position="-3 2.1 -3" width="2.5" height="0.6" material="color: #0f172a; opacity: 0.95; stroke: #00a599; strokeWidth: 2">
        <a-text value="Unidade 6: Biomecânica 3D

  <!-- LÓGICA DE INTERAÇÃO, NAVEGAÇÃO ENTRE SALAS & AUDIO -->
  <script>
    const roomPositions = {
      1: { x: 0, y: 0, z: 5 },
      2: { x: -16, y: 0, z: 5 },
      3: { x: 16, y: 0, z: 5 },
      4: { x: 0, y: 0, z: -11 },
      5: { x: 0, y: 0, z: 21 }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const clickables = document.querySelectorAll('.clickable');
      clickables.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          handleObjectClick(el);
        });
      });
    });

    function teleportToRoom(roomNum) {
      const pos = roomPositions[roomNum];
      if (!pos) return;

      const rig = document.getElementById('rig');
      if (rig) {
        rig.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
      }

      // Atualizar botões de navegação no topo
      document.querySelectorAll('.room-nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === (roomNum - 1));
      });
    }

    function handleObjectClick(el) {
      const infoTitle = el.getAttribute('data-info');
      const infoText = el.getAttribute('data-text');
      const optsJson = el.getAttribute('data-options');

      if (!infoTitle || !infoText) return;

      openVRModal(infoTitle, infoText, optsJson ? JSON.parse(optsJson) : []);
    }

    function openVRModal(title, text, options) {
      const panel = document.getElementById('info-panel');
      const titleEl = document.getElementById('info-title');
      const textEl = document.getElementById('info-text');
      const optsBox = document.getElementById('modal-options');
      const feedbackEl = document.getElementById('feedback-vr');

      titleEl.innerHTML = `<span>📍</span> ${title}`;
      textEl.innerText = text;
      optsBox.innerHTML = '';
      feedbackEl.style.display = 'none';

      if (options && options.length > 0) {
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'modal-opt-btn';
          btn.innerText = opt.text;
          btn.onclick = () => {
            feedbackEl.style.display = 'block';
            if (opt.correct) {
              feedbackEl.className = 'feedback-box-vr feedback-correct-vr';
              feedbackEl.innerHTML = `<strong>✅ Decisão Correta!</strong><p>${opt.feedback}</p>`;
              speakAudio(opt.feedback);
            } else {
              feedbackEl.className = 'feedback-box-vr feedback-incorrect-vr';
              feedbackEl.innerHTML = `<strong>❌ Atenção!</strong><p>${opt.feedback}</p>`;
              speakAudio(opt.feedback);
            }
          };
          optsBox.appendChild(btn);
        });
      }

      panel.style.display = 'block';
      speakAudio(text);
    }

    function closeVRModal() {
      document.getElementById('info-panel').style.display = 'none';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function clickEVA() {
      openVRModal(
        "🤖 E.V.A. — TUTORA DIGITAL EM TECNOLOGIA ASSISTIVA",
        "Bem-vindo(a) ao Campus Virtual 3D Digitrilha! Explore as 5 Salas Temáticas com as 14 Unidades didáticas. Clique nos marcadores esféricos pulsantes para realizar as avaliações clínicas em VR!",
        [
          {"text": "Explorar o Campus VR", "correct": true, "feedback": "Use a barra superior para navegar entre a Sala 1, Sala 2, Sala 3, Sala 4 e Sala 5!"}
        ]
      );
    }

    function speakAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'pt-BR';
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      }
    }
  </script>
