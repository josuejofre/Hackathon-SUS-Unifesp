<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Digitrilha VR — UBS Virtual 3D & Simulação Clínica</title>
  <meta name="description" content="Simulação em Realidade Virtual 3D e Apoio à Decisão Clínica em Tecnologia Assistiva para o SUS.">
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #000; overflow: hidden; }

    /* HUD (não-VR) */
    #vr-ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
    }

    #vr-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(0,10,30,0.95) 0%, transparent 100%);
      pointer-events: auto;
    }

    .vr-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
    }

    .vr-logo-icon {
      background: linear-gradient(135deg, #00a599, #004f9f);
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(0,165,153,0.4);
    }

    .vr-badge {
      background: linear-gradient(135deg, #00a599, #004f9f);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(0,79,159,0.3);
    }

    #vr-instructions {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 165, 153, 0.4);
      border-radius: 50px;
      padding: 12px 28px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: none;
      backdrop-filter: blur(12px);
      white-space: nowrap;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: floatInstr 3s ease-in-out infinite;
    }

    @keyframes floatInstr {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    #vr-back-btn {
      position: fixed;
      top: 75px; left: 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      color: white;
      padding: 10px 22px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }
    #vr-back-btn:hover { background: rgba(0,165,153,0.4); border-color: #00a599; }

    /* Painel de Modal Interativo 3D/2D Overlay */
    #info-panel {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00a599;
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 520px;
      z-index: 1000;
      pointer-events: auto;
      display: none;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,165,153,0.3);
      color: white;
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    #info-panel h3 {
      font-family: 'Outfit', sans-serif;
      color: #00a599;
      font-size: 1.25rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #info-panel p {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .modal-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-opt-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .modal-opt-btn:hover {
      background: #004f9f;
      border-color: #00a599;
      transform: translateX(4px);
    }

    .feedback-box-vr {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .feedback-correct-vr { background: rgba(5, 150, 105, 0.25); border: 1px solid #059669; color: #6ee7b7; }
    .feedback-incorrect-vr { background: rgba(220, 38, 38, 0.25); border: 1px solid #dc2626; color: #fca5a5; }

    #info-panel .close-info {
      position: absolute;
      top: 16px; right: 18px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #info-panel .close-info:hover { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="vr-ui">
    <div id="vr-header">
      <a href="index.html" class="vr-logo">
        <div class="vr-logo-icon">✚</div>
        Digitrilha <strong style="color:#00a599">VR</strong>
      </a>
      <div class="vr-badge">🥽 MODO VR 3D INTERATIVO</div>
    </div>
  </div>

  <!-- BOTÃO VOLTAR -->
  <a href="index.html" id="vr-back-btn">← Voltar à Digitrilha</a>

  <!-- INSTRUÇÕES DE NAVEGAÇÃO E CLIQUE -->
  <div id="vr-instructions">
    🖱️ Clique com o mouse nos marcadores azuis pulsantes para interagir | WASD para andar
  </div>

  <!-- PAINEL DE MODAL INTERATIVO (3D/2D OVERLAY) -->
  <div id="info-panel">
    <button class="close-info" onclick="closeVRModal()">✕</button>
    <h3 id="info-title"><span>📍</span> INTERAÇÃO CLÍNICA</h3>
    <p id="info-text"></p>
    <div class="modal-options" id="modal-options"></div>
    <div class="feedback-box-vr" id="feedback-vr"></div>
  </div>

  <!-- CENA A-FRAME WEBXR -->
  <a-scene
    background="color: #87ceeb"
    fog="type: linear; color: #b0d8f0; near: 15; far: 35"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
    loading-screen="dotsColor: #00a599; backgroundColor: #0f172a"
  >

    <!-- === CÂMERA COM SUPORTE DUAL: MOUSE CLICK + GAZE CURSOR === -->
    <a-entity id="rig" position="0 0 5">
      <a-camera look-controls="reverseMouseDrag: false" wasd-controls="enabled: true" position="0 1.6 0">
        <a-cursor
          id="vr-cursor"
          color="#00a599"
          fuse="false"
          raycaster="objects: .clickable"
          cursor="rayOrigin: mouse"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <!-- === ASSETS & MIXINS === -->
    <a-assets>
      <a-mixin id="hotspot"
        geometry="primitive: sphere; radius: 0.18"
        material="color: #00a599; emissive: #00a599; emissiveIntensity: 0.6; transparent: true; opacity: 0.9"
        animation="property: scale; dir: alternate; dur: 1000; loop: true; to: 1.3 1.3 1.3; easing: easeInOutSine"
        class="clickable">
      </a-mixin>
    </a-assets>

    <!-- ============================================================
         ESTRUTURA DA SALA DA UBS
         ============================================================ -->
    <!-- CHÃO -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" material="color: #c8bda0; roughness: 1.0"></a-plane>
    <!-- TETO -->
    <a-plane position="0 3.2 0" rotation="90 0 0" width="10" height="10" material="color: #f8f6f0; roughness: 0.9"></a-plane>
    <!-- PAREDES -->
    <a-plane position="0 1.6 -5" width="10" height="3.2" material="color: #eee8d8; roughness: 0.8"></a-plane>
    <a-plane position="-5 1.6 0" rotation="0 90 0" width="10" height="3.2" material="color: #e8e0d0; roughness: 0.8"></a-plane>
    <a-plane position="5 1.6 0" rotation="0 -90 0" width="10" height="3.2" material="color: #e8e0d0; roughness: 0.8"></a-plane>

    <!-- ============================================================
         MOBILIÁRIO & ELEMENTOS CLÍNICOS 3D
         ============================================================ -->
    <!-- MESA DO MÉDICO -->
    <a-entity position="0 0 -3.5">
      <a-box width="2.2" height="0.08" depth="0.9" position="0 0.78 0" material="color: #7a5a3c; roughness: 0.7"></a-box>
      <a-box width="0.06" height="0.78" depth="0.06" position="-1.0 0.39 0.4" material="color: #5a3c20"></a-box>
      <a-box width="0.06" height="0.78" depth="0.06" position="1.0 0.39 0.4" material="color: #5a3c20"></a-box>
      <a-box width="0.06" height="0.78" depth="0.06" position="-1.0 0.39 -0.4" material="color: #5a3c20"></a-box>
      <a-box width="0.06" height="0.78" depth="0.06" position="1.0 0.39 -0.4" material="color: #5a3c20"></a-box>
      
      <!-- Monitor e-SUS APS -->
      <a-box width="0.6" height="0.4" depth="0.03" position="-0.5 1.14 -0.3" material="color: #1a1a1a"></a-box>
      <a-box width="0.58" height="0.38" depth="0.02" position="-0.5 1.14 -0.285" material="color: #004f9f; emissive: #004f9f; emissiveIntensity: 0.4"></a-box>
      
      <!-- Órteses em 3D sobre a mesa -->
      <a-torus radius="0.1" radius-tubular="0.02" arc="180" position="0.5 0.88 -0.1" rotation="90 0 0" material="color: #00a599"></a-torus>
    </a-entity>

    <!-- CADEIRA DE RODAS DO PACIENTE -->
    <a-entity position="-1.5 0 -1.5" rotation="0 45 0">
      <a-cylinder radius="0.35" height="0.04" position="-0.35 0.35 0" rotation="0 0 90" material="color: #222"></a-cylinder>
      <a-cylinder radius="0.35" height="0.04" position="0.35 0.35 0" rotation="0 0 90" material="color: #222"></a-cylinder>
      <a-box width="0.6" height="0.06" depth="0.6" position="0 0.42 0" material="color: #004f9f"></a-box>
      <a-box width="0.6" height="0.6" depth="0.06" position="0 0.72 -0.28" material="color: #004f9f"></a-box>
    </a-entity>

    <!-- ============================================================
         HOTSPOTS CLICÁVEIS E INTERATIVOS
         ============================================================ -->

    <!-- HOTSPOT 1: Avaliação de AFO -->
    <a-sphere
      mixin="hotspot"
      position="-1.5 1.4 -1.5"
      class="clickable"
      data-id="afo"
      data-info="🦶 AVALIAÇÃO DE ÓRTESE (CASO DONA MARIA)"
      data-text="Dona Maria (72 anos, pós-AVC há 6 meses) apresenta fraqueza nos dorsiflexores e pé caído à esquerda durante o treino de marcha. Qual a conduta ortótica mais adequada?"
      data-options='[
        {"text": "Prescrever Órtese Tornozelo-Pé (AFO) alinhada a 90° e orientação de uso com calçado fechado", "correct": true, "feedback": "Excelente! A AFO mantém o tornozelo funcional a 90°, previne o arrasto do pé na marcha e reduz quedas."},
        {"text": "Manter marcha sem apoio ortótico", "correct": false, "feedback": "Incorreto. A ausência de apoio mantém o risco de quedas e o padrão em ceifa."}
      ]'
    ></a-sphere>
    <a-text value="👆 Clique:\nAvaliar Órtese" position="-1.5 1.85 -1.5" align="center" color="#00ffd8" width="2.8" wrap-count="14"></a-text>

    <!-- HOTSPOT 2: Prontuário e-SUS APS -->
    <a-sphere
      mixin="hotspot"
      position="-0.5 1.25 -3.5"
      class="clickable"
      data-id="prontuario"
      data-info="📋 PRONTUÁRIO CLÍNICO (e-SUS APS)"
      data-text="Dona Maria, 72 anos. AVC isquêmico há 6 meses. Apresenta pé caído à esquerda com espasticidade grau 2 (Escala de Ashworth). Qual órtese deve ser prescrita?"
      data-options='[
        {"text": "Órtese Tornozelo-Pé (AFO) articulada para treino de marcha", "correct": true, "feedback": "Perfeito! A AFO estabiliza o tornozelo e melhora a marcha funcional."},
        {"text": "Colar cervical rígido", "correct": false, "feedback": "Incorreto. Não se aplica ao quadro de pé caído."}
      ]'
    ></a-sphere>
    <a-text value="👆 Clique:\nVer Prontuário" position="-0.5 1.7 -3.5" align="center" color="#00ffd8" width="2.8" wrap-count="14"></a-text>

    <!-- HOTSPOT 3: Mesa de Impressão 3D -->
    <a-sphere
      mixin="hotspot"
      position="0.5 1.25 -3.5"
      class="clickable"
      data-id="3d"
      data-info="🦿 BANCADA DE IMPRESSÃO 3D vs TRADICIONAL"
      data-text="Você está na bancada de prototipagem 3D. Qual a principal vantagem do escaneamento 3D em relação ao molde de gesso?"
      data-options='[
        {"text": "Armazenar o arquivo CAD na nuvem e permitir reimpressão direta sem nova moldagem", "correct": true, "feedback": "Excelente! O arquivo digital elimina o desconforto de moldar o paciente novamente."},
        {"text": "Demorar mais tempo e ocupar mais espaço físico", "correct": false, "feedback": "Incorreto. O fluxo digital otimiza tempo e espaço."}
      ]'
    ></a-sphere>
    <a-text value="👆 Clique:\nFluxo 3D vs Gesso" position="0.5 1.7 -3.5" align="center" color="#00ffd8" width="2.8" wrap-count="14"></a-text>

    <!-- HOTSPOT 4: Legislação do SUS -->
    <a-sphere
      mixin="hotspot"
      position="3.5 1.8 -4.8"
      class="clickable"
      data-id="legislação"
      data-info="📜 LEGISLAÇÃO E REDE REGULADA (SUS)"
      data-text="Portaria de Consolidação MS nº 2/2017: Qual a função da Atenção Primária (UBS) no fluxo de dispensação de OPM?"
      data-options='[
        {"text": "Realizar a triagem, avaliação funcional inicial e encaminhamento regulado ao CER", "correct": true, "feedback": "Correto! A UBS é a porta de entrada para a Rede de Cuidados à Pessoa com Deficiência."},
        {"text": "Encaminhar o paciente sem laudo ou justificativa funcional", "correct": false, "feedback": "Incorreto. A ausência de laudo funcional invalida o processo de dispensação da OPM."}
      ]'
    ></a-sphere>
    <a-text value="👆 Clique:\nLegislação SUS" position="3.5 2.25 -4.8" align="center" color="#00ffd8" width="2.8" wrap-count="14"></a-text>

    <!-- ============================================================
         E.V.A. (Assistente Virtual 3D)
         ============================================================ -->
    <a-entity position="2.2 0 -2.0" rotation="0 -45 0" class="clickable" onclick="clickEVA()">
      <!-- Corpo Robótico -->
      <a-cylinder radius="0.18" height="0.06" position="0 0.03 0" material="color: #004f9f"></a-cylinder>
      <a-cylinder radius="0.1" height="0.6" position="0 0.33 0" material="color: #00a599"></a-cylinder>
      <a-box width="0.38" height="0.5" depth="0.25" position="0 0.88 0" material="color: #004f9f"></a-box>
      <!-- Cruz da Saúde -->
      <a-box width="0.06" height="0.22" depth="0.03" position="0 0.88 0.14" material="color: white; emissive: white; emissiveIntensity: 0.6"></a-box>
      <a-box width="0.22" height="0.06" depth="0.03" position="0 0.88 0.14" material="color: white; emissive: white; emissiveIntensity: 0.6"></a-box>
      <!-- Cabeça & Olhos -->
      <a-sphere radius="0.2" position="0 1.3 0" material="color: #00a599; emissive: #00a599; emissiveIntensity: 0.3"></a-sphere>
      <a-box width="0.14" height="0.06" depth="0.02" position="-0.06 1.33 0.19" material="color: #00ffd8; emissive: #00ffd8; emissiveIntensity: 1.0"></a-box>
      <a-box width="0.14" height="0.06" depth="0.02" position="0.06 1.33 0.19" material="color: #00ffd8; emissive: #00ffd8; emissiveIntensity: 1.0"></a-box>
    </a-entity>

    <a-text value="🤖 E.V.A. (Clique para Tutor IA)" position="2.2 2.1 -2.0" align="center" color="#00ffd8" width="3.2" wrap-count="20"></a-text>

    <!-- ILUMINAÇÃO -->
    <a-light type="ambient" color="#d8e8f8" intensity="0.7"></a-light>
    <a-light type="directional" position="-1 4 2" color="#fff5e0" intensity="0.8"></a-light>
    <a-sky color="#87ceeb" radius="50"></a-sky>

  </a-scene>

  <!-- LÓGICA DE INTERAÇÃO E CLIQUES DUAL (MOUSE + VR) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Adicionar event listeners aos objetos .clickable diretamente via JS
      const clickables = document.querySelectorAll('.clickable');
      clickables.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          handleObjectClick(el);
        });
      });
    });

    function handleObjectClick(el) {
      const infoTitle = el.getAttribute('data-info');
      const infoText = el.getAttribute('data-text');
      const optsJson = el.getAttribute('data-options');

      if (!infoTitle || !infoText) return;

      openVRModal(infoTitle, infoText, optsJson ? JSON.parse(optsJson) : []);
    }

    function openVRModal(title, text, options) {
      const panel = document.getElementById('info-panel');
      const titleEl = document.getElementById('info-title');
      const textEl = document.getElementById('info-text');
      const optsBox = document.getElementById('modal-options');
      const feedbackEl = document.getElementById('feedback-vr');

      titleEl.innerHTML = `<span>📍</span> ${title}`;
      textEl.innerText = text;
      optsBox.innerHTML = '';
      feedbackEl.style.display = 'none';

      if (options && options.length > 0) {
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'modal-opt-btn';
          btn.innerText = opt.text;
          btn.onclick = () => {
            feedbackEl.style.display = 'block';
            if (opt.correct) {
              feedbackEl.className = 'feedback-box-vr feedback-correct-vr';
              feedbackEl.innerHTML = `<strong>✅ Decisão Correta!</strong><p>${opt.feedback}</p>`;
              speakAudio(opt.feedback);
            } else {
              feedbackEl.className = 'feedback-box-vr feedback-incorrect-vr';
              feedbackEl.innerHTML = `<strong>❌ Atenção!</strong><p>${opt.feedback}</p>`;
              speakAudio(opt.feedback);
            }
          };
          optsBox.appendChild(btn);
        });
      }

      panel.style.display = 'block';
      speakAudio(text);
    }

    function closeVRModal() {
      document.getElementById('info-panel').style.display = 'none';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function clickEVA() {
      openVRModal(
        "🤖 E.V.A. — TUTORA DIGITAL EM TECNOLOGIA ASSISTIVA",
        "Olá! Sou a E.V.A. Explore os pontos azuis da sala para realizar a avaliação clínica de Dona Maria e testar seus conhecimentos em prescrição de OPM no SUS!",
        [
          {"text": "Iniciar Avaliação Clínica em VR", "correct": true, "feedback": "Ótimo! Clique nos marcadores 3D para examinar o paciente e a prescrição."}
        ]
      );
    }

    function speakAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'pt-BR';
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      }
    }
  </script>
</body>
</html>
