<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Digitrilha VR 3D — Campus de Reabilitação (14 Unidades)</title>
  <meta name="description" content="Simulação em Realidade Virtual 3D com Corredor Conectado, 5 Salas e Apoio à Decisão Clínica em Tecnologia Assistiva para o SUS.">
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0b0f19; overflow: hidden; }

    /* TOP HUD NAVEGADOR */
    #vr-ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
    }

    #vr-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: linear-gradient(180deg, rgba(11,15,25,0.98) 0%, rgba(11,15,25,0.88) 100%);
      border-bottom: 1px solid rgba(0,165,153,0.4);
      pointer-events: auto;
    }

    .vr-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
    }

    .vr-logo-icon {
      background: linear-gradient(135deg, #00a599, #004f9f);
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(0,165,153,0.4);
    }

    .room-nav-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .room-nav-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .room-nav-btn:hover, .room-nav-btn.active {
      background: #00a599;
      color: white;
      border-color: #00ffd8;
      box-shadow: 0 2px 10px rgba(0,165,153,0.5);
    }

    #vr-back-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: white;
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    #vr-back-btn:hover { background: rgba(0,165,153,0.4); border-color: #00a599; }

    /* BARRA INFERIOR DE INTERAÇÃO RÁPIDA (ACESSIBILIDADE DUAL) */
    #quick-interact-bar {
      position: fixed;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(0, 165, 153, 0.5);
      border-radius: 40px;
      padding: 8px 18px;
      z-index: 999;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      max-width: 95vw;
      overflow-x: auto;
    }

    .quick-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #00ffd8;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: #004f9f;
      color: white;
    }

    /* PAINEL MODAL INTERATIVO 2D OVERLAY */
    #info-panel {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #00a599;
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 540px;
      z-index: 10000;
      pointer-events: auto;
      display: none;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 35px rgba(0,165,153,0.4);
      color: white;
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    #info-panel h3 {
      font-family: 'Outfit', sans-serif;
      color: #00ffd8;
      font-size: 1.15rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #info-panel p {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .modal-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-opt-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .modal-opt-btn:hover {
      background: #004f9f;
      border-color: #00a599;
    }

    .feedback-box-vr {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }

    .feedback-correct-vr { background: rgba(5, 150, 105, 0.25); border: 1px solid #059669; color: #6ee7b7; }
    .feedback-incorrect-vr { background: rgba(220, 38, 38, 0.25); border: 1px solid #dc2626; color: #fca5a5; }

    #info-panel .close-info {
      position: absolute;
      top: 14px; right: 16px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #info-panel .close-info:hover { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <!-- HEADER NAV -->
  <div id="vr-ui">
    <div id="vr-header">
      <a href="index.html" class="vr-logo">
        <div class="vr-logo-icon">✚</div>
        Digitrilha <strong style="color:#00a599">VR 3D</strong>
      </a>

      <div class="room-nav-bar">
        <button class="room-nav-btn active" onclick="teleportToRoom(1)">🏛️ Sala 1: Fundamentos</button>
        <button class="room-nav-btn" onclick="teleportToRoom(2)">🩺 Sala 2: Avaliação</button>
        <button class="room-nav-btn" onclick="teleportToRoom(3)">🦾 Sala 3: Laboratório OPM</button>
        <button class="room-nav-btn" onclick="teleportToRoom(4)">⚙️ Sala 4: Manufatura 3D</button>
        <button class="room-nav-btn" onclick="teleportToRoom(5)">🏆 Sala 5: Resultados</button>
      </div>

      <a href="index.html" id="vr-back-btn">← Sair</a>
    </div>
  </div>

  <!-- BARRA DE ATALHOS DE INTERAÇÃO -->
  <div id="quick-interact-bar">
    <span style="color:#94a3b8; font-size:0.75rem; font-weight:700; margin-right:4px;">INTERAGIR:</span>
    <button class="quick-btn" onclick="triggerStation('u1')">Unidade 1 (LBI)</button>
    <button class="quick-btn" onclick="triggerStation('u2')">Unidade 2 (CIF)</button>
    <button class="quick-btn" onclick="triggerStation('u3')">Unidade 3 (Dona Maria)</button>
    <button class="quick-btn" onclick="triggerStation('u4')">Unidade 4 (Laudo OPM)</button>
    <button class="quick-btn" onclick="triggerStation('u5')">Unidade 5 (Erros)</button>
    <button class="quick-btn" onclick="triggerStation('u6')">Unidade 6 (3 Pontos)</button>
    <button class="quick-btn" onclick="triggerStation('u10')">Unidade 10 (Impressão 3D)</button>
    <button class="quick-btn" onclick="clickEVA()">🤖 E.V.A. IA</button>
  </div>

  <!-- PAINEL MODAL OVERLAY -->
  <div id="info-panel">
    <button class="close-info" onclick="closeVRModal()">✕</button>
    <h3 id="info-title"><span>📍</span> ESTAÇÃO DE APRENDIZADO VR</h3>
    <p id="info-text"></p>
    <div class="modal-options" id="modal-options"></div>
    <div class="feedback-box-vr" id="feedback-vr"></div>
  </div>

  <!-- CENA A-FRAME WEBXR -->
  <a-scene
    background="color: #0b0f19"
    fog="type: linear; color: #0b0f19; near: 15; far: 40"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
  >

    <!-- CÂMERA COM RETÍCULO VIRTUAL CURSOR -->
    <a-entity id="rig" position="0 0 0">
      <a-camera id="main-camera" look-controls="reverseMouseDrag: false" wasd-controls="enabled: true" position="0 1.6 0">
        <a-entity
          cursor="fuse: false; rayOrigin: mouse"
          raycaster="objects: .clickable, a-sphere, a-box, a-cylinder"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          material="color: #00ffd8; shader: flat; opacity: 0.8"
        ></a-entity>
      </a-camera>
    </a-entity>

    <!-- ASSETS & MIXINS -->
    <a-assets>
      <a-mixin id="hotspot"
        geometry="primitive: sphere; radius: 0.28"
        material="color: #00a599; emissive: #00ffd8; emissiveIntensity: 0.9; transparent: true; opacity: 0.95"
        animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.25 1.25 1.25; easing: easeInOutSine"
        class="clickable">
      </a-mixin>

      <a-mixin id="pedestal"
        geometry="primitive: cylinder; radius: 0.5; height: 0.8"
        material="color: #1e293b; roughness: 0.3">
      </a-mixin>

      <a-mixin id="door-portal"
        geometry="primitive: cylinder; radius: 0.6; height: 0.05"
        material="color: #00a599; emissive: #00ffd8; emissiveIntensity: 0.6; opacity: 0.8"
        class="clickable">
      </a-mixin>
    </a-assets>

    <!-- ============================================================ -->
    <!-- CORREDOR CENTRAL DE INTEGRAÇÃO DO CAMPUS                      -->
    <!-- Largura: 6m (X: -3 a 3), Comprimento: 32m (Z: -16 a 16)        -->
    <!-- ============================================================ -->
    <a-entity id="corredor-central">
      <!-- CHÃO DO CORREDOR -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="6" height="32" material="color: #1e293b; roughness: 0.7"></a-plane>
      <a-plane position="0 3.8 0" rotation="90 0 0" width="6" height="32" material="color: #0f172a"></a-plane>

      <!-- PAREDES LATERAIS DO CORREDOR (COM ARCHWAYS PARA AS SALAS) -->
      <!-- Parede Esquerda (X: -3) -->
      <a-plane position="-3 1.9 -14" width="0.1" height="3.8" rotation="0 90 0" material="color: #0f172a"></a-plane>
      <a-plane position="-3 1.9 -2" width="0.1" height="3.8" rotation="0 90 0" material="color: #0f172a"></a-plane>
      <a-plane position="-3 1.9 10" width="0.1" height="3.8" rotation="0 90 0" material="color: #0f172a"></a-plane>

      <!-- Parede Direita (X: 3) -->
      <a-plane position="3 1.9 -8" width="0.1" height="3.8" rotation="0 90 0" material="color: #0f172a"></a-plane>
      <a-plane position="3 1.9 4" width="0.1" height="3.8" rotation="0 90 0" material="color: #0f172a"></a-plane>

      <!-- LETREIRO DO CORREDOR -->
      <a-plane position="0 3.2 -14" width="5.5" height="0.7" material="color: #004f9f; opacity: 0.9">
        <a-text value="🏥 CORREDOR CENTRAL DE REABILITAÇÃO SUS" align="center" position="0 0 0.02" color="#ffffff" width="4.2" wrap-count="30"></a-text>
      </a-plane>
    </a-entity>

    <!-- ============================================================ -->
    <!-- PORTAIS DE ACESSO (PORTAS 3D COM PORTAL TELEPORT)            -->
    <!-- ============================================================ -->
    <!-- PORTA 1 ➔ SALA 1 -->
    <a-entity position="-2.6 0 -10" onclick="teleportToRoom(1)" class="clickable">
      <a-cylinder mixin="door-portal"></a-cylinder>
      <a-box position="0 1.2 0" width="0.1" height="2.2" depth="1.2" material="color: #00a599"></a-box>
      <a-plane position="0.1 2.2 0" rotation="0 90 0" width="1.6" height="0.4" material="color: #004f9f">
        <a-text value="🚪 Entrada: Sala 1 (Fundamentos)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="24"></a-text>
      </a-plane>
    </a-entity>

    <!-- PORTA 2 ➔ SALA 2 -->
    <a-entity position="2.6 0 -4" onclick="teleportToRoom(2)" class="clickable">
      <a-cylinder mixin="door-portal"></a-cylinder>
      <a-box position="0 1.2 0" width="0.1" height="2.2" depth="1.2" material="color: #00a599"></a-box>
      <a-plane position="-0.1 2.2 0" rotation="0 -90 0" width="1.6" height="0.4" material="color: #004f9f">
        <a-text value="🚪 Entrada: Sala 2 (Avaliacao)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="24"></a-text>
      </a-plane>
    </a-entity>

    <!-- PORTA 3 ➔ SALA 3 -->
    <a-entity position="-2.6 0 2" onclick="teleportToRoom(3)" class="clickable">
      <a-cylinder mixin="door-portal"></a-cylinder>
      <a-box position="0 1.2 0" width="0.1" height="2.2" depth="1.2" material="color: #00a599"></a-box>
      <a-plane position="0.1 2.2 0" rotation="0 90 0" width="1.6" height="0.4" material="color: #004f9f">
        <a-text value="🚪 Entrada: Sala 3 (Laboratorio OPM)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="26"></a-text>
      </a-plane>
    </a-entity>

    <!-- PORTA 4 ➔ SALA 4 -->
    <a-entity position="2.6 0 8" onclick="teleportToRoom(4)" class="clickable">
      <a-cylinder mixin="door-portal"></a-cylinder>
      <a-box position="0 1.2 0" width="0.1" height="2.2" depth="1.2" material="color: #00a599"></a-box>
      <a-plane position="-0.1 2.2 0" rotation="0 -90 0" width="1.6" height="0.4" material="color: #004f9f">
        <a-text value="🚪 Entrada: Sala 4 (Manufatura 3D)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="26"></a-text>
      </a-plane>
    </a-entity>

    <!-- PORTA 5 ➔ SALA 5 -->
    <a-entity position="-2.6 0 14" onclick="teleportToRoom(5)" class="clickable">
      <a-cylinder mixin="door-portal"></a-cylinder>
      <a-box position="0 1.2 0" width="0.1" height="2.2" depth="1.2" material="color: #00a599"></a-box>
      <a-plane position="0.1 2.2 0" rotation="0 90 0" width="1.6" height="0.4" material="color: #004f9f">
        <a-text value="🚪 Entrada: Sala 5 (Resultados)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="24"></a-text>
      </a-plane>
    </a-entity>


    <!-- ============================================================ -->
    <!-- SALA 1 (EIXO 1 — UNIDADES 1 & 2: FUNDAMENTOS & LBI)           -->
    <!-- Posição: Center X: -9, Z: -10                                -->
    <!-- ============================================================ -->
    <a-entity id="sala-1" position="-9 0 -10">
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" material="color: #111827; roughness: 0.8"></a-plane>
      <a-plane position="0 3.6 0" rotation="90 0 0" width="10" height="10" material="color: #0f172a"></a-plane>
      <a-plane position="0 1.8 -5" width="10" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="-5 1.8 0" rotation="0 90 0" width="10" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="5 1.8 0" rotation="0 -90 0" width="10" height="3.6" material="color: #0f172a"></a-plane>

      <a-plane position="0 2.8 -4.9" width="6.5" height="0.8" material="color: #004f9f; opacity: 0.95">
        <a-text value="🏛️ SALA 1 — UNIDADES 1 & 2: FUNDAMENTOS DE TA & LBI" align="center" position="0 0 0.02" color="#ffffff" width="4.2" wrap-count="28"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 1.1: LBI -->
      <a-cylinder mixin="pedestal" position="-2.5 0.4 -2.5"></a-cylinder>
      <a-sphere mixin="hotspot" position="-2.5 1.4 -2.5" onclick="triggerStation('u1')"></a-sphere>
      <a-plane position="-2.5 1.95 -2.5" width="2.4" height="0.55" material="color: #0f172a; opacity: 0.95">
        <a-text value="Unidade 1: Conceito de TA & LBI
(Clique para examinar)" align="center" position="0 0 0.02" color="#00ffd8" width="2.1" wrap-count="22"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 1.2: CIF -->
      <a-cylinder mixin="pedestal" position="2.5 0.4 -2.5"></a-cylinder>
      <a-sphere mixin="hotspot" position="2.5 1.4 -2.5" onclick="triggerStation('u2')"></a-sphere>
      <a-plane position="2.5 1.95 -2.5" width="2.4" height="0.55" material="color: #0f172a; opacity: 0.95">
        <a-text value="Unidade 2: Avaliação CIF OMS
(Clique para examinar)" align="center" position="0 0 0.02" color="#00ffd8" width="2.1" wrap-count="22"></a-text>
      </a-plane>

      <!-- TUTORA E.V.A. -->
      <a-entity position="0 0 -2.5" class="clickable" onclick="clickEVA()">
        <a-cylinder radius="0.18" height="0.06" position="0 0.03 0" material="color: #004f9f"></a-cylinder>
        <a-cylinder radius="0.1" height="0.6" position="0 0.33 0" material="color: #00a599"></a-cylinder>
        <a-box width="0.38" height="0.45" depth="0.22" position="0 0.85 0" material="color: #004f9f"></a-box>
        <a-sphere radius="0.18" position="0 1.25 0" material="color: #00a599; emissive: #00a599; emissiveIntensity: 0.5"></a-sphere>
        <a-box width="0.12" height="0.05" depth="0.02" position="-0.05 1.28 0.17" material="color: #00ffd8; emissive: #00ffd8; emissiveIntensity: 1.0"></a-box>
        <a-box width="0.12" height="0.05" depth="0.02" position="0.05 1.28 0.17" material="color: #00ffd8; emissive: #00ffd8; emissiveIntensity: 1.0"></a-box>
      </a-entity>
      <a-plane position="0 1.9 -2.5" width="2.5" height="0.5" material="color: #0f172a; opacity: 0.95">
        <a-text value="🤖 E.V.A. — Tutora Digital
(Clique para Orientacao)" align="center" position="0 0 0.02" color="#00ffd8" width="2.2" wrap-count="22"></a-text>
      </a-plane>
    </a-entity>


    <!-- ============================================================ -->
    <!-- SALA 2 (EIXO 2 — UNIDADES 3, 4 & 5: AVALIAÇÃO CLÍNICA)         -->
    <!-- Posição: Center X: 9, Z: -4                                  -->
    <!-- ============================================================ -->
    <a-entity id="sala-2" position="9 0 -4">
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" material="color: #111827; roughness: 0.8"></a-plane>
      <a-plane position="0 3.6 0" rotation="90 0 0" width="10" height="10" material="color: #0f172a"></a-plane>
      <a-plane position="0 1.8 -5" width="10" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="-5 1.8 0" rotation="0 90 0" width="10" height="3.6" material="color: #0f172a"></a-plane>
      <a-plane position="5 1.8 0" rotation="0 -90 0" width="10" height="3.6" material="color: #0f172a"></a-plane>

      <a-plane position="0 2.8 -4.9" width="6.8" height="0.8" material="color: #004f9f; opacity: 0.95">
        <a-text value="🩺 SALA 2 — UNIDADES 3, 4 & 5: AVALIAÇÃO CLÍNICA & TRIAGEM" align="center" position="0 0 0.02" color="#ffffff" width="4.2" wrap-count="30"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 2.1: Caso Dona Maria -->
      <a-cylinder mixin="pedestal" position="-2.5 0.4 -2.5"></a-cylinder>
      <a-sphere mixin="hotspot" position="-2.5 1.4 -2.5" onclick="triggerStation('u3')"></a-sphere>
      <a-plane position="-2.5 1.95 -2.5" width="2.4" height="0.55" material="color: #0f172a; opacity: 0.95">
        <a-text value="Unidade 3: Caso Dona Maria
(Clique para examinar)" align="center" position="0 0 0.02" color="#00ffd8" width="2.1" wrap-count="22"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 2.2: Laudo de OPM -->
      <a-cylinder mixin="pedestal" position="2.5 0.4 -2.5"></a-cylinder>
      <a-sphere mixin="hotspot" position="2.5 1.4 -2.5" onclick="triggerStation('u4')"></a-sphere>
      <a-plane position="2.5 1.95 -2.5" width="2.4" height="0.55" material="color: #0f172a; opacity: 0.95">
        <a-text value="Unidade 4: Laudo de OPM
(Clique para examinar)" align="center" position="0 0 0.02" color="#00ffd8" width="2.1" wrap-count="22"></a-text>
      </a-plane>

      <!-- ESTAÇÃO 2.3: Prevenção de Erros -->
      <a-cylinder mixin="pedestal" position="0 0.4 -3.5"></a-cylinder>
      <a-sphere mixin="hotspot" position="0 1.4 -3.5" onclick="triggerStation('u5')"></a-sphere>
      <a-plane position="0 1.95 -3.5" width="2.4" height="0.55" material="color: #0f172a; opacity: 0.95">
        <a-text value="Unidade 5: Prevenção de Erros
(Clique para examinar)" align="center" position="0 0 0.02" color="#00ffd8" width="2.1" wrap-count="22"></a-text>
      </a-plane>

    const roomPositions = {
      1: { x: -9, y: 0, z: -5 },
      2: { x: 9, y: 0, z: 1 },
      3: { x: -9, y: 0, z: 7 },
      4: { x: 9, y: 0, z: 13 },
      5: { x: -9, y: 0, z: 19 }
    };

    function teleportToRoom(roomNum) {
      const pos = roomPositions[roomNum];
      if (!pos) return;

      const rig = document.getElementById('rig');
      if (rig) {
        rig.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
      }

      document.querySelectorAll('.room-nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === (roomNum - 1));
      });
    }

    function triggerStation(stationKey) {
      const data = stationData[stationKey];
      if (data) {
        openVRModal(data.title, data.text, data.options);
      }
    }

    function openVRModal(title, text, options) {
      const panel = document.getElementById('info-panel');
      const titleEl = document.getElementById('info-title');
      const textEl = document.getElementById('info-text');
      const optsBox = document.getElementById('modal-options');
      const feedbackEl = document.getElementById('feedback-vr');

      titleEl.innerHTML = `<span>📍</span> ${title}`;
      textEl.innerText = text;
      optsBox.innerHTML = '';
      feedbackEl.style.display = 'none';

      if (options && options.length > 0) {
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'modal-opt-btn';
          btn.innerText = opt.text;
          btn.onclick = () => {
            feedbackEl.style.display = 'block';
            if (opt.correct) {
              feedbackEl.className = 'feedback-box-vr feedback-correct-vr';
              feedbackEl.innerHTML = `<strong>✅ Decisão Correta!</strong><p>${opt.feedback}</p>`;
              speakAudio(opt.feedback);
            } else {
              feedbackEl.className = 'feedback-box-vr feedback-incorrect-vr';
              feedbackEl.innerHTML = `<strong>❌ Atenção!</strong><p>${opt.feedback}</p>`;
              speakAudio(opt.feedback);
            }
          };
          optsBox.appendChild(btn);
        });
      }

      panel.style.display = 'block';
      speakAudio(text);
    }

    function closeVRModal() {
      document.getElementById('info-panel').style.display = 'none';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function clickEVA() {
      openVRModal(
        "🤖 E.V.A. — TUTORA DIGITAL EM TECNOLOGIA ASSISTIVA",
        "Bem-vindo(a) ao Campus de Reabilitação Virtual 3D! Você está no Corredor Central conectado a 5 Salas de Aula. Clique nas esferas azuis pulsantes nas salas ou use a barra de atalhos inferior para interagir com cada Unidade!",
        [
          {"text": "Explorar o Campus VR", "correct": true, "feedback": "Excelente! Use a barra superior para teleportar entre as Salas 1 a 5."}
        ]
      );
    }

    function speakAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'pt-BR';
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      }
    }
